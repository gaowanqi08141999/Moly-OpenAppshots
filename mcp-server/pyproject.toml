[project]
name = "qclaw-appshots"
version = "0.1.0"
description = "MCP Server exposing macOS Appshot capture as agent tools"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    "pydantic>=2.0",
]

[project.scripts]
qclaw-appshots = "qclaw_appshots.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
